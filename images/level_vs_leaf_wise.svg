<svg width="720" height="290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="360" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">Tree Growth Strategies</text>

  <!-- Level-wise -->
  <text x="180" y="50" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Level-wise (XGBoost default, depth-limited)</text>
  <g stroke="#555" stroke-width="1.2">
    <line x1="180" y1="80" x2="110" y2="130"/><line x1="180" y1="80" x2="250" y2="130"/>
    <line x1="110" y1="130" x2="75" y2="180"/><line x1="110" y1="130" x2="145" y2="180"/>
    <line x1="250" y1="130" x2="215" y2="180"/><line x1="250" y1="130" x2="285" y2="180"/>
  </g>
  <circle cx="180" cy="80" r="13" fill="#3498db"/>
  <circle cx="110" cy="130" r="13" fill="#3498db"/>
  <circle cx="250" cy="130" r="13" fill="#3498db"/>
  <circle cx="75" cy="180" r="13" fill="#27ae60"/>
  <circle cx="145" cy="180" r="13" fill="#27ae60"/>
  <circle cx="215" cy="180" r="13" fill="#27ae60"/>
  <circle cx="285" cy="180" r="13" fill="#27ae60"/>
  <text x="180" y="84" fill="white" font-size="10" text-anchor="middle">1</text>
  <text x="110" y="134" fill="white" font-size="10" text-anchor="middle">2</text>
  <text x="250" y="134" fill="white" font-size="10" text-anchor="middle">2</text>
  <text x="180" y="222" fill="#555" font-size="11" text-anchor="middle">Split every node at a depth before going deeper.</text>
  <text x="180" y="238" fill="#555" font-size="11" text-anchor="middle">Balanced, harder to overfit, wastes splits on</text>
  <text x="180" y="254" fill="#555" font-size="11" text-anchor="middle">nodes with little left to gain.</text>

  <line x1="360" y1="45" x2="360" y2="265" stroke="#ddd" stroke-width="1"/>

  <!-- Leaf-wise -->
  <text x="540" y="50" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Leaf-wise / best-first (LightGBM)</text>
  <g stroke="#555" stroke-width="1.2">
    <line x1="500" y1="80" x2="450" y2="125"/><line x1="500" y1="80" x2="560" y2="125"/>
    <line x1="560" y1="125" x2="520" y2="165"/><line x1="560" y1="125" x2="610" y2="165"/>
    <line x1="610" y1="165" x2="580" y2="205"/><line x1="610" y1="165" x2="650" y2="205"/>
  </g>
  <circle cx="500" cy="80" r="13" fill="#3498db"/>
  <circle cx="450" cy="125" r="13" fill="#27ae60"/>
  <circle cx="560" cy="125" r="13" fill="#3498db"/>
  <circle cx="520" cy="165" r="13" fill="#27ae60"/>
  <circle cx="610" cy="165" r="13" fill="#3498db"/>
  <circle cx="580" cy="205" r="13" fill="#27ae60"/>
  <circle cx="650" cy="205" r="13" fill="#27ae60"/>
  <text x="500" y="84" fill="white" font-size="10" text-anchor="middle">1</text>
  <text x="560" y="129" fill="white" font-size="10" text-anchor="middle">2</text>
  <text x="610" y="169" fill="white" font-size="10" text-anchor="middle">3</text>
  <text x="540" y="238" fill="#555" font-size="11" text-anchor="middle">Always split the leaf with the largest gain, anywhere.</text>
  <text x="540" y="254" fill="#555" font-size="11" text-anchor="middle">Lower loss for the same number of leaves; limit it</text>
  <text x="540" y="270" fill="#555" font-size="11" text-anchor="middle">with num_leaves and min_data_in_leaf or it overfits.</text>
</svg>
