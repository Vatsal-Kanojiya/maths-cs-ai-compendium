<svg width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="pd-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>
  <text x="380" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">Structure Prediction and Protein Design Run in Opposite Directions</text>

  <!-- prediction row -->
  <text x="20" y="58" fill="#333" font-size="12" font-weight="bold">Prediction</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20" y="68" width="150" height="54" rx="6" fill="#3498db" opacity="0.12" stroke="#3498db"/>
    <text x="95" y="90" fill="#333" font-weight="bold">sequence</text>
    <text x="95" y="107" fill="#555">MKTAYIAKQR…</text>
    <rect x="215" y="68" width="170" height="54" rx="6" fill="#3498db" opacity="0.12" stroke="#3498db"/>
    <text x="300" y="90" fill="#333" font-weight="bold">MSA / language model</text>
    <text x="300" y="107" fill="#555">evolutionary context</text>
    <rect x="430" y="68" width="150" height="54" rx="6" fill="#3498db" opacity="0.12" stroke="#3498db"/>
    <text x="505" y="90" fill="#333" font-weight="bold">trunk</text>
    <text x="505" y="107" fill="#555">pair representation</text>
    <rect x="625" y="68" width="120" height="54" rx="6" fill="#3498db" opacity="0.25" stroke="#3498db"/>
    <text x="685" y="90" fill="#333" font-weight="bold">3D structure</text>
    <text x="685" y="107" fill="#555">+ confidence</text>
  </g>
  <g stroke="#555" stroke-width="1.2">
    <line x1="172" y1="95" x2="211" y2="95" marker-end="url(#pd-arrow)"/>
    <line x1="387" y1="95" x2="426" y2="95" marker-end="url(#pd-arrow)"/>
    <line x1="582" y1="95" x2="621" y2="95" marker-end="url(#pd-arrow)"/>
  </g>
  <text x="380" y="142" fill="#777" font-size="10" text-anchor="middle">AlphaFold 2/3, RoseTTAFold, ESMFold</text>

  <!-- design row -->
  <text x="20" y="178" fill="#333" font-size="12" font-weight="bold">Design</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20" y="188" width="135" height="54" rx="6" fill="#e74c3c" opacity="0.12" stroke="#e74c3c"/>
    <text x="87" y="210" fill="#333" font-weight="bold">goal</text>
    <text x="87" y="227" fill="#555">bind this target site</text>
    <rect x="185" y="188" width="135" height="54" rx="6" fill="#e74c3c" opacity="0.12" stroke="#e74c3c"/>
    <text x="252" y="210" fill="#333" font-weight="bold">backbone</text>
    <text x="252" y="227" fill="#555">diffusion (RFdiffusion)</text>
    <rect x="350" y="188" width="135" height="54" rx="6" fill="#e74c3c" opacity="0.12" stroke="#e74c3c"/>
    <text x="417" y="210" fill="#333" font-weight="bold">sequence</text>
    <text x="417" y="227" fill="#555">inverse folding (MPNN)</text>
    <rect x="515" y="188" width="110" height="54" rx="6" fill="#f39c12" opacity="0.15" stroke="#f39c12"/>
    <text x="570" y="210" fill="#333" font-weight="bold">in silico check</text>
    <text x="570" y="227" fill="#555">refold, compare</text>
    <rect x="655" y="188" width="90" height="54" rx="6" fill="#27ae60" opacity="0.18" stroke="#27ae60"/>
    <text x="700" y="210" fill="#333" font-weight="bold">wet lab</text>
    <text x="700" y="227" fill="#555">express, test</text>
  </g>
  <g stroke="#555" stroke-width="1.2">
    <line x1="157" y1="215" x2="181" y2="215" marker-end="url(#pd-arrow)"/>
    <line x1="322" y1="215" x2="346" y2="215" marker-end="url(#pd-arrow)"/>
    <line x1="487" y1="215" x2="511" y2="215" marker-end="url(#pd-arrow)"/>
    <line x1="627" y1="215" x2="651" y2="215" marker-end="url(#pd-arrow)"/>
  </g>
  <path d="M570,244 C570,275 420,275 417,248" fill="none" stroke="#f39c12" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#pd-arrow)"/>
  <text x="495" y="285" fill="#f39c12" font-size="10" text-anchor="middle">reject designs that do not refold to the intended backbone</text>

  <text x="380" y="315" fill="#333" font-size="11" text-anchor="middle">The prediction model is reused as a filter in the design loop; only the lab can say whether a design really works.</text>
</svg>
