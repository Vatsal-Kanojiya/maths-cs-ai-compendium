<text x="380" y="270" fill="#333" font-size="12" text-anchor="middle">The VC dimension is the largest number of points a class can shatter: 3 for lines in the plane,</text>
<text x="380" y="288" fill="#333" font-size="12" text-anchor="middle">d + 1 for halfspaces in d dimensions. It need not match the parameter count: sign(sin(ωx)) has one parameter, infinite VC dimension.</text>
