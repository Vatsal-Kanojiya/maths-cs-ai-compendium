<svg width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="gbs-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>
  <text x="380" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">Gradient Boosting: Each Tree Fits What the Ensemble Still Gets Wrong</text>

  <!-- Stage boxes -->
  <g>
    <rect x="20" y="45" width="160" height="150" rx="6" fill="#3498db" opacity="0.08" stroke="#3498db" stroke-width="1.2"/>
    <text x="100" y="64" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Stage 0: constant</text>
    <line x1="35" y1="170" x2="165" y2="170" stroke="#999" stroke-width="1"/>
    <!-- data points (a rising curve) -->
    <circle cx="45" cy="160" r="2.5" fill="#555"/><circle cx="60" cy="150" r="2.5" fill="#555"/>
    <circle cx="75" cy="152" r="2.5" fill="#555"/><circle cx="90" cy="130" r="2.5" fill="#555"/>
    <circle cx="105" cy="118" r="2.5" fill="#555"/><circle cx="120" cy="104" r="2.5" fill="#555"/>
    <circle cx="135" cy="96" r="2.5" fill="#555"/><circle cx="150" cy="82" r="2.5" fill="#555"/>
    <line x1="38" y1="124" x2="160" y2="124" stroke="#3498db" stroke-width="2.5"/>
    <text x="100" y="188" fill="#555" font-size="10" text-anchor="middle">F₀ = mean(y)</text>
  </g>

  <line x1="184" y1="120" x2="208" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#gbs-arrow)"/>

  <g>
    <rect x="212" y="45" width="160" height="150" rx="6" fill="#e74c3c" opacity="0.08" stroke="#e74c3c" stroke-width="1.2"/>
    <text x="292" y="64" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Residuals r = y − F₀</text>
    <line x1="227" y1="120" x2="357" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- residual bars -->
    <line x1="237" y1="120" x2="237" y2="156" stroke="#e74c3c" stroke-width="2"/>
    <line x1="252" y1="120" x2="252" y2="146" stroke="#e74c3c" stroke-width="2"/>
    <line x1="267" y1="120" x2="267" y2="148" stroke="#e74c3c" stroke-width="2"/>
    <line x1="282" y1="120" x2="282" y2="126" stroke="#e74c3c" stroke-width="2"/>
    <line x1="297" y1="120" x2="297" y2="114" stroke="#27ae60" stroke-width="2"/>
    <line x1="312" y1="120" x2="312" y2="100" stroke="#27ae60" stroke-width="2"/>
    <line x1="327" y1="120" x2="327" y2="92" stroke="#27ae60" stroke-width="2"/>
    <line x1="342" y1="120" x2="342" y2="78" stroke="#27ae60" stroke-width="2"/>
    <!-- stump fit to residuals -->
    <polyline points="230,148 290,148 290,96 352,96" fill="none" stroke="#f39c12" stroke-width="2.5"/>
    <text x="292" y="188" fill="#555" font-size="10" text-anchor="middle">fit a small tree h₁ to r</text>
  </g>

  <line x1="376" y1="120" x2="400" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#gbs-arrow)"/>

  <g>
    <rect x="404" y="45" width="160" height="150" rx="6" fill="#27ae60" opacity="0.08" stroke="#27ae60" stroke-width="1.2"/>
    <text x="484" y="64" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Update: F₁ = F₀ + ηh₁</text>
    <line x1="419" y1="170" x2="549" y2="170" stroke="#999" stroke-width="1"/>
    <circle cx="429" cy="160" r="2.5" fill="#555"/><circle cx="444" cy="150" r="2.5" fill="#555"/>
    <circle cx="459" cy="152" r="2.5" fill="#555"/><circle cx="474" cy="130" r="2.5" fill="#555"/>
    <circle cx="489" cy="118" r="2.5" fill="#555"/><circle cx="504" cy="104" r="2.5" fill="#555"/>
    <circle cx="519" cy="96" r="2.5" fill="#555"/><circle cx="534" cy="82" r="2.5" fill="#555"/>
    <polyline points="422,129 482,129 482,118 544,118" fill="none" stroke="#3498db" stroke-width="2.5"/>
    <text x="484" y="188" fill="#555" font-size="10" text-anchor="middle">a small step (η ≈ 0.1) toward it</text>
  </g>

  <line x1="568" y1="120" x2="592" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#gbs-arrow)"/>

  <g>
    <rect x="596" y="45" width="150" height="150" rx="6" fill="#9b59b6" opacity="0.08" stroke="#9b59b6" stroke-width="1.2"/>
    <text x="671" y="64" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">After M stages</text>
    <line x1="606" y1="170" x2="736" y2="170" stroke="#999" stroke-width="1"/>
    <circle cx="616" cy="160" r="2.5" fill="#555"/><circle cx="631" cy="150" r="2.5" fill="#555"/>
    <circle cx="646" cy="152" r="2.5" fill="#555"/><circle cx="661" cy="130" r="2.5" fill="#555"/>
    <circle cx="676" cy="118" r="2.5" fill="#555"/><circle cx="691" cy="104" r="2.5" fill="#555"/>
    <circle cx="706" cy="96" r="2.5" fill="#555"/><circle cx="721" cy="82" r="2.5" fill="#555"/>
    <polyline points="609,158 624,158 624,151 654,151 654,131 669,131 669,118 684,118 684,104 699,104 699,96 714,96 714,84 731,84" fill="none" stroke="#3498db" stroke-width="2.5"/>
    <text x="671" y="188" fill="#555" font-size="10" text-anchor="middle">F_M = F₀ + η Σ hₘ</text>
  </g>

  <text x="380" y="232" fill="#333" font-size="12" text-anchor="middle">For squared error the "residual" is literally y − F. For any other loss it is the negative gradient −∂L/∂F,</text>
  <text x="380" y="250" fill="#333" font-size="12" text-anchor="middle">so boosting is gradient descent where each step is a tree, taken in the space of functions.</text>
  <text x="380" y="276" fill="#777" font-size="11" text-anchor="middle">Small η means many trees but better generalisation; early stopping on a validation set picks M.</text>
</svg>
