<svg width="800" height="290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="400" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">One Simulation of Monte Carlo Tree Search</text>
  <!-- reusable tree drawn four times -->
  <g id="panel1">
    <text x="100" y="52" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">1. Selection</text>
    <text x="100" y="68" fill="#555" font-size="10" text-anchor="middle">follow highest UCT score</text>
    <g stroke="#bbb" stroke-width="1.2"><line x1="100" y1="90" x2="60" y2="140"/><line x1="100" y1="90" x2="140" y2="140"/><line x1="140" y1="140" x2="115" y2="190"/><line x1="140" y1="140" x2="165" y2="190"/></g>
    <g stroke="#3498db" stroke-width="3"><line x1="100" y1="90" x2="140" y2="140"/><line x1="140" y1="140" x2="165" y2="190"/></g>
    <circle cx="100" cy="90" r="11" fill="#3498db"/><circle cx="60" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="140" cy="140" r="11" fill="#3498db"/>
    <circle cx="115" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="165" cy="190" r="11" fill="#3498db"/>
  </g>
  <g transform="translate(200,0)">
    <text x="100" y="52" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">2. Expansion</text>
    <text x="100" y="68" fill="#555" font-size="10" text-anchor="middle">add one untried move</text>
    <g stroke="#bbb" stroke-width="1.2"><line x1="100" y1="90" x2="60" y2="140"/><line x1="100" y1="90" x2="140" y2="140"/><line x1="140" y1="140" x2="115" y2="190"/><line x1="140" y1="140" x2="165" y2="190"/></g>
    <line x1="165" y1="190" x2="165" y2="235" stroke="#27ae60" stroke-width="3"/>
    <circle cx="100" cy="90" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="60" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="140" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/>
    <circle cx="115" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="165" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/>
    <circle cx="165" cy="240" r="11" fill="#27ae60"/>
  </g>
  <g transform="translate(400,0)">
    <text x="100" y="52" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">3. Simulation</text>
    <text x="100" y="68" fill="#555" font-size="10" text-anchor="middle">random playout or value network</text>
    <g stroke="#bbb" stroke-width="1.2"><line x1="100" y1="90" x2="60" y2="140"/><line x1="100" y1="90" x2="140" y2="140"/><line x1="140" y1="140" x2="115" y2="190"/><line x1="140" y1="140" x2="165" y2="190"/><line x1="165" y1="190" x2="165" y2="240"/></g>
    <circle cx="100" cy="90" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="60" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="140" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/>
    <circle cx="115" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="165" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/>
    <circle cx="165" cy="240" r="11" fill="#f39c12"/>
    <path d="M176,240 q12,-8 20,0 t20,0 t20,0" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="238" y="262" fill="#f39c12" font-size="11" text-anchor="end">result: win</text>
  </g>
  <g transform="translate(600,0)">
    <text x="100" y="52" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">4. Backpropagation</text>
    <text x="100" y="68" fill="#555" font-size="10" text-anchor="middle">update N and W along the path</text>
    <g stroke="#bbb" stroke-width="1.2"><line x1="100" y1="90" x2="60" y2="140"/><line x1="140" y1="140" x2="115" y2="190"/></g>
    <g stroke="#9b59b6" stroke-width="3"><line x1="100" y1="90" x2="140" y2="140"/><line x1="140" y1="140" x2="165" y2="190"/><line x1="165" y1="190" x2="165" y2="240"/></g>
    <circle cx="100" cy="90" r="11" fill="#9b59b6"/><circle cx="60" cy="140" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="140" cy="140" r="11" fill="#9b59b6"/>
    <circle cx="115" cy="190" r="11" fill="#ecf0f1" stroke="#95a5a6"/><circle cx="165" cy="190" r="11" fill="#9b59b6"/>
    <circle cx="165" cy="240" r="11" fill="#9b59b6"/>
  </g>
  <text x="400" y="283" fill="#333" font-size="11" text-anchor="middle">Repeat many times, then play the most visited move at the root.</text>
</svg>
