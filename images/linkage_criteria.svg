<svg width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="380" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">Linkage: How Far Apart Are Two Clusters?</text>

  <!-- Panel template: cluster A (blue) left, cluster B (green) right -->
  <!-- Single -->
  <g transform="translate(15,40)">
    <rect width="170" height="150" rx="6" fill="#fafafa" stroke="#ddd"/>
    <text x="85" y="18" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Single</text>
    <circle cx="35" cy="60" r="5" fill="#3498db"/><circle cx="50" cy="95" r="5" fill="#3498db"/><circle cx="65" cy="70" r="5" fill="#3498db"/>
    <circle cx="110" cy="80" r="5" fill="#27ae60"/><circle cx="135" cy="60" r="5" fill="#27ae60"/><circle cx="130" cy="105" r="5" fill="#27ae60"/>
    <line x1="65" y1="70" x2="110" y2="80" stroke="#e74c3c" stroke-width="2"/>
    <text x="85" y="132" fill="#555" font-size="10" text-anchor="middle">closest pair</text>
  </g>
  <!-- Complete -->
  <g transform="translate(200,40)">
    <rect width="170" height="150" rx="6" fill="#fafafa" stroke="#ddd"/>
    <text x="85" y="18" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Complete</text>
    <circle cx="35" cy="60" r="5" fill="#3498db"/><circle cx="50" cy="95" r="5" fill="#3498db"/><circle cx="65" cy="70" r="5" fill="#3498db"/>
    <circle cx="110" cy="80" r="5" fill="#27ae60"/><circle cx="135" cy="60" r="5" fill="#27ae60"/><circle cx="130" cy="105" r="5" fill="#27ae60"/>
    <line x1="35" y1="60" x2="130" y2="105" stroke="#e74c3c" stroke-width="2"/>
    <text x="85" y="132" fill="#555" font-size="10" text-anchor="middle">farthest pair</text>
  </g>
  <!-- Average -->
  <g transform="translate(385,40)">
    <rect width="170" height="150" rx="6" fill="#fafafa" stroke="#ddd"/>
    <text x="85" y="18" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Average</text>
    <circle cx="35" cy="60" r="5" fill="#3498db"/><circle cx="50" cy="95" r="5" fill="#3498db"/><circle cx="65" cy="70" r="5" fill="#3498db"/>
    <circle cx="110" cy="80" r="5" fill="#27ae60"/><circle cx="135" cy="60" r="5" fill="#27ae60"/><circle cx="130" cy="105" r="5" fill="#27ae60"/>
    <g stroke="#e74c3c" stroke-width="0.8" opacity="0.7">
      <line x1="35" y1="60" x2="110" y2="80"/><line x1="35" y1="60" x2="135" y2="60"/><line x1="35" y1="60" x2="130" y2="105"/>
      <line x1="50" y1="95" x2="110" y2="80"/><line x1="50" y1="95" x2="135" y2="60"/><line x1="50" y1="95" x2="130" y2="105"/>
      <line x1="65" y1="70" x2="110" y2="80"/><line x1="65" y1="70" x2="135" y2="60"/><line x1="65" y1="70" x2="130" y2="105"/>
    </g>
    <text x="85" y="132" fill="#555" font-size="10" text-anchor="middle">mean of all pairs</text>
  </g>
  <!-- Ward -->
  <g transform="translate(570,40)">
    <rect width="175" height="150" rx="6" fill="#fafafa" stroke="#ddd"/>
    <text x="87" y="18" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Ward</text>
    <circle cx="35" cy="60" r="5" fill="#3498db"/><circle cx="50" cy="95" r="5" fill="#3498db"/><circle cx="65" cy="70" r="5" fill="#3498db"/>
    <circle cx="110" cy="80" r="5" fill="#27ae60"/><circle cx="135" cy="60" r="5" fill="#27ae60"/><circle cx="130" cy="105" r="5" fill="#27ae60"/>
    <circle cx="50" cy="75" r="4" fill="none" stroke="#3498db" stroke-width="2"/>
    <circle cx="125" cy="82" r="4" fill="none" stroke="#27ae60" stroke-width="2"/>
    <circle cx="87" cy="78" r="44" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="87" y="134" fill="#555" font-size="10" text-anchor="middle">increase in within-cluster</text>
    <text x="87" y="146" fill="#555" font-size="10" text-anchor="middle">variance if merged</text>
  </g>

  <text x="380" y="215" fill="#555" font-size="11" text-anchor="middle">Single linkage follows chains and finds elongated shapes, but one stray bridge merges everything.</text>
  <text x="380" y="232" fill="#555" font-size="11" text-anchor="middle">Complete and Ward prefer compact, similar-sized clusters; average sits between them.</text>
</svg>
