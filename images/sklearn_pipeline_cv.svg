<svg width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="pl-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>
  <text x="380" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">A Pipeline Is the Model: Every Fitted Step Is Refitted on Each Training Fold</text>

  <!-- outer CV box -->
  <rect x="15" y="40" width="730" height="210" rx="8" fill="#9b59b6" opacity="0.05" stroke="#9b59b6" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="30" y="60" fill="#9b59b6" font-size="12" font-weight="bold">cross_validate(pipeline, X_train, y_train)  repeats everything inside for each fold</text>

  <!-- raw table -->
  <rect x="35" y="110" width="110" height="90" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="90" y="132" fill="#333" font-size="11" font-weight="bold" text-anchor="middle">raw DataFrame</text>
  <text x="90" y="152" fill="#555" font-size="10" text-anchor="middle">age, fee, tickets…</text>
  <text x="90" y="168" fill="#555" font-size="10" text-anchor="middle">plan, country…</text>
  <text x="90" y="184" fill="#555" font-size="10" text-anchor="middle">(with NaNs)</text>

  <line x1="148" y1="155" x2="178" y2="155" stroke="#555" stroke-width="1.2" marker-end="url(#pl-arrow)"/>

  <!-- ColumnTransformer -->
  <rect x="182" y="78" width="330" height="160" rx="6" fill="#3498db" opacity="0.07" stroke="#3498db" stroke-width="1.2"/>
  <text x="347" y="96" fill="#3498db" font-size="12" font-weight="bold" text-anchor="middle">ColumnTransformer</text>

  <text x="200" y="128" fill="#555" font-size="10">numeric</text>
  <rect x="250" y="110" width="110" height="30" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="305" y="129" fill="#333" font-size="11" text-anchor="middle">SimpleImputer</text>
  <line x1="362" y1="125" x2="384" y2="125" stroke="#555" stroke-width="1" marker-end="url(#pl-arrow)"/>
  <rect x="388" y="110" width="110" height="30" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="443" y="129" fill="#333" font-size="11" text-anchor="middle">StandardScaler</text>

  <text x="200" y="183" fill="#555" font-size="10">categorical</text>
  <rect x="250" y="165" width="248" height="30" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="374" y="184" fill="#333" font-size="11" text-anchor="middle">OneHotEncoder(handle_unknown="ignore")</text>

  <text x="347" y="226" fill="#777" font-size="10" text-anchor="middle">learns medians, means, variances, category lists</text>

  <line x1="515" y1="155" x2="545" y2="155" stroke="#555" stroke-width="1.2" marker-end="url(#pl-arrow)"/>

  <!-- model -->
  <rect x="549" y="125" width="110" height="60" rx="6" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="1.2"/>
  <text x="604" y="150" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">estimator</text>
  <text x="604" y="168" fill="#555" font-size="10" text-anchor="middle">LogisticRegression</text>

  <line x1="662" y1="155" x2="692" y2="155" stroke="#555" stroke-width="1.2" marker-end="url(#pl-arrow)"/>
  <text x="712" y="152" fill="#333" font-size="11" text-anchor="middle">p(y)</text>

  <text x="380" y="275" fill="#333" font-size="11" text-anchor="middle">fit() learns every step from the training fold only; predict() applies the same learned steps to new rows.</text>
  <text x="380" y="293" fill="#777" font-size="11" text-anchor="middle">Preprocessing done outside the pipeline, on all the data, leaks the validation fold into training.</text>
</svg>
