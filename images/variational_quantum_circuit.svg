<svg width="760" height="250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="380" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">A Variational Quantum Classifier (one layer, repeated L times)</text>

  <!-- wires -->
  <line x1="80" y1="80" x2="690" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="690" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="85" fill="#333" font-size="14">|0⟩</text>
  <text x="40" y="155" fill="#333" font-size="14">|0⟩</text>

  <!-- encoding -->
  <rect x="105" y="62" width="80" height="36" rx="4" fill="#f39c12"/>
  <text x="145" y="85" fill="white" font-size="12" text-anchor="middle">RY(π x₁)</text>
  <rect x="105" y="132" width="80" height="36" rx="4" fill="#f39c12"/>
  <text x="145" y="155" fill="white" font-size="12" text-anchor="middle">RY(π x₂)</text>

  <!-- trainable -->
  <rect x="210" y="62" width="70" height="36" rx="4" fill="#3498db"/>
  <text x="245" y="85" fill="white" font-size="12" text-anchor="middle">RY(θ₁)</text>
  <rect x="295" y="62" width="70" height="36" rx="4" fill="#3498db"/>
  <text x="330" y="85" fill="white" font-size="12" text-anchor="middle">RZ(θ₂)</text>
  <rect x="210" y="132" width="70" height="36" rx="4" fill="#3498db"/>
  <text x="245" y="155" fill="white" font-size="12" text-anchor="middle">RY(θ₃)</text>
  <rect x="295" y="132" width="70" height="36" rx="4" fill="#3498db"/>
  <text x="330" y="155" fill="white" font-size="12" text-anchor="middle">RZ(θ₄)</text>

  <!-- CNOT -->
  <circle cx="410" cy="80" r="6" fill="#333"/>
  <line x1="410" y1="80" x2="410" y2="162" stroke="#333" stroke-width="1.5"/>
  <circle cx="410" cy="150" r="12" fill="white" stroke="#333" stroke-width="1.5"/>
  <line x1="398" y1="150" x2="422" y2="150" stroke="#333" stroke-width="1.5"/>

  <!-- repeat bracket -->
  <rect x="95" y="50" width="345" height="130" rx="6" fill="none" stroke="#9b59b6" stroke-dasharray="5,4"/>
  <text x="268" y="196" fill="#9b59b6" font-size="11" text-anchor="middle">× L layers (data re-uploaded in every layer)</text>

  <text x="545" y="118" fill="#777" font-size="18" text-anchor="middle">…</text>

  <!-- measurement -->
  <rect x="610" y="62" width="60" height="36" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M620,90 A20,20 0 0 1 660,90" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="640" y1="90" x2="654" y2="70" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="85" fill="#27ae60" font-size="12">⟨Z⟩</text>

  <text x="145" y="230" fill="#f39c12" font-size="11" text-anchor="middle">encode the input</text>
  <text x="290" y="230" fill="#3498db" font-size="11" text-anchor="middle">trainable rotations</text>
  <text x="410" y="230" fill="#333" font-size="11" text-anchor="middle">entangle</text>
  <text x="640" y="230" fill="#27ae60" font-size="11" text-anchor="middle">measure: class score in [−1, 1]</text>
</svg>
