<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">DBSCAN: Core, Border and Noise Points (minPts = 4)</text>

  <!-- eps circles around core points -->
  <circle cx="200" cy="140" r="45" fill="#3498db" opacity="0.08" stroke="#3498db" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="245" cy="160" r="45" fill="#3498db" opacity="0.08" stroke="#3498db" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="290" cy="140" r="45" fill="#3498db" opacity="0.08" stroke="#3498db" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="325" cy="125" r="45" fill="#f39c12" opacity="0.08" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- eps radius label -->
  <line x1="200" y1="140" x2="200" y2="95" stroke="#555" stroke-width="1"/>
  <text x="206" y="112" fill="#555" font-size="11">ε</text>

  <!-- core points -->
  <circle cx="200" cy="140" r="6" fill="#3498db"/>
  <circle cx="245" cy="160" r="6" fill="#3498db"/>
  <circle cx="290" cy="140" r="6" fill="#3498db"/>
  <circle cx="175" cy="165" r="6" fill="#3498db"/>
  <circle cx="215" cy="185" r="6" fill="#3498db"/>
  <circle cx="265" cy="190" r="6" fill="#3498db"/>
  <circle cx="230" cy="120" r="6" fill="#3498db"/>
  <circle cx="300" cy="175" r="6" fill="#3498db"/>
  <circle cx="165" cy="125" r="6" fill="#3498db"/>

  <!-- border point: within eps of a core point, but few neighbours itself -->
  <circle cx="325" cy="125" r="6" fill="#f39c12"/>

  <!-- noise -->
  <circle cx="470" cy="80" r="6" fill="#e74c3c"/>
  <circle cx="110" cy="240" r="6" fill="#e74c3c"/>

  <!-- legend / explanation -->
  <circle cx="440" cy="150" r="6" fill="#3498db"/>
  <text x="455" y="154" fill="#333" font-size="12"><tspan font-weight="bold">core</tspan>: ≥ minPts points within ε</text>
  <circle cx="440" cy="180" r="6" fill="#f39c12"/>
  <text x="455" y="184" fill="#333" font-size="12"><tspan font-weight="bold">border</tspan>: within ε of a core point,</text>
  <text x="455" y="199" fill="#333" font-size="12">but not dense enough itself</text>
  <circle cx="440" cy="225" r="6" fill="#e74c3c"/>
  <text x="455" y="229" fill="#333" font-size="12"><tspan font-weight="bold">noise</tspan>: neither</text>

  <text x="350" y="275" fill="#555" font-size="11" text-anchor="middle">A cluster is everything reachable through chains of core points. No number of clusters is needed, shapes can be</text>
  <text x="350" y="291" fill="#555" font-size="11" text-anchor="middle">arbitrary, and outliers are left unassigned. One global ε cannot fit clusters of very different density (HDBSCAN can).</text>
</svg>
